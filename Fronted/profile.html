
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - OneClick</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <!-- Profile CSS -->
    <link rel="stylesheet" href="css/profile.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container-fluid px-4">

        <a id="brandDashboardLink" class="navbar-brand oc-brand" href="customer-dashboard.html">
            <img src="assests/images/logo.png" alt="OneClick" class="oneclick-logo">
        </a>

        <div class="ms-auto d-flex align-items-center gap-3">

            <a id="dashboardLink" href="customer-dashboard.html" class="btn btn-light">
                <i class="fa-solid fa-house"></i>
                Dashboard
            </a>

            <button id="logoutBtn" class="btn btn-outline-danger">
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </button>

        </div>
    </div>
</nav>


<!-- MAIN CONTENT -->
<main class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-9">

            <!-- PAGE HEADER -->
            <div class="mb-4">
                <h2 class="fw-bold mb-1">My Profile</h2>
                <p class="text-muted mb-0">
                    Manage your OneClick account information.
                </p>
            </div>


            <!-- PROFILE CARD -->
            <div class="card profile-card border-0 shadow-sm">
                <div class="card-body p-4 p-md-5">

                    <!-- PROFILE HEADER -->
                    <div class="profile-header mb-5">

                        <div class="text-center">

                            <div class="profile-avatar" id="profileAvatar">
                                <i class="fa-solid fa-user"></i>
                            </div>

                            <input
                                type="file"
                                id="profilePictureInput"
                                accept="image/*"
                                hidden
                            >

                            <div class="mt-2 d-flex gap-2 justify-content-center">

                                <button
                                    type="button"
                                    class="btn btn-sm btn-outline-primary"
                                    id="uploadPictureBtn"
                                >
                                    <i class="fa-solid fa-camera"></i>
                                    Change Photo
                                </button>

                                <button
                                    type="button"
                                    class="btn btn-sm btn-outline-danger"
                                    id="removePictureBtn"
                                >
                                    <i class="fa-solid fa-trash"></i>
                                    Remove
                                </button>

                            </div>
                        </div>

                        <div>
                            <h4 id="profileName" class="fw-bold mb-1">
                                Loading...
                            </h4>

                            <p id="profileRole" class="text-muted mb-0">
                                Customer
                            </p>
                        </div>

                    </div>


                    <!-- ALERT -->
                    <div
                        id="profileAlert"
                        class="alert d-none"
                        role="alert"
                    ></div>


                    <!-- PROFILE FORM -->
                    <form id="profileForm">

                        <div class="row g-4">

                            <!-- FIRST NAME -->
                            <div class="col-md-6">
                                <label for="firstName" class="form-label fw-semibold">
                                    First Name
                                </label>

                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fa-solid fa-user"></i>
                                    </span>

                                    <input
                                        type="text"
                                        id="firstName"
                                        class="form-control"
                                        placeholder="Enter first name"
                                        required
                                    >
                                </div>
                            </div>


                            <!-- LAST NAME -->
                            <div class="col-md-6">
                                <label for="lastName" class="form-label fw-semibold">
                                    Last Name
                                </label>

                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fa-solid fa-user"></i>
                                    </span>

                                    <input
                                        type="text"
                                        id="lastName"
                                        class="form-control"
                                        placeholder="Enter last name"
                                    >
                                </div>
                            </div>


                            <!-- EMAIL -->
                            <div class="col-md-6">
                                <label for="email" class="form-label fw-semibold">
                                    Email Address
                                </label>

                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fa-solid fa-envelope"></i>
                                    </span>

                                    <input
                                        type="email"
                                        id="email"
                                        class="form-control"
                                        readonly
                                    >
                                </div>

                                <small class="text-muted">
                                    Email cannot be changed from this page.
                                </small>
                            </div>


                            <!-- ROLE -->
                            <div class="col-md-6">
                                <label for="role" class="form-label fw-semibold">
                                    Account Type
                                </label>

                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fa-solid fa-id-badge"></i>
                                    </span>

                                    <input
                                        type="text"
                                        id="role"
                                        class="form-control"
                                        readonly
                                    >
                                </div>
                            </div>


                            <!-- PHONE -->
                            <div class="col-md-6">
                                <label for="phone" class="form-label fw-semibold">
                                    Phone Number
                                </label>

                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fa-solid fa-phone"></i>
                                    </span>

                                    <input
                                        type="tel"
                                        id="phone"
                                        class="form-control"
                                        placeholder="Enter phone number"
                                    >
                                </div>
                            </div>


                            <!-- COUNTRY -->
                            <div class="col-md-6">
                                <label for="country" class="form-label fw-semibold">
                                    Country
                                </label>

                                <input
                                    type="text"
                                    id="country"
                                    class="form-control"
                                    placeholder="Enter country"
                                >
                            </div>


                            <!-- PROVINCE -->
                            <div class="col-md-6">
                                <label for="province" class="form-label fw-semibold">
                                    Province
                                </label>

                                <input
                                    type="text"
                                    id="province"
                                    class="form-control"
                                    placeholder="Enter province"
                                >
                            </div>


                            <!-- DISTRICT -->
                            <div class="col-md-6">
                                <label for="district" class="form-label fw-semibold">
                                    District
                                </label>

                                <input
                                    type="text"
                                    id="district"
                                    class="form-control"
                                    placeholder="Enter district"
                                >
                            </div>


                            <!-- CITY -->
                            <div class="col-md-6">
                                <label for="city" class="form-label fw-semibold">
                                    City / Municipality
                                </label>

                                <input
                                    type="text"
                                    id="city"
                                    class="form-control"
                                    placeholder="Enter city"
                                >
                            </div>

                        </div>


                        <!-- BUTTONS -->
                        <div class="profile-actions mt-5">

                            <button
                                type="submit"
                                id="saveBtn"
                                class="btn btn-primary px-4"
                            >
                                <i class="fa-solid fa-floppy-disk"></i>
                                Save Changes
                            </button>

                            <button
                                type="button"
                                id="resetBtn"
                                class="btn btn-light px-4"
                            >
                                <i class="fa-solid fa-rotate-left"></i>
                                Reset
                            </button>

                        </div>

                    </form>

                </div>
            </div>


            <!-- ACCOUNT INFORMATION -->
            <div class="card border-0 shadow-sm mt-4">
                <div class="card-body p-4">

                    <h5 class="fw-bold mb-3">
                        <i class="fa-solid fa-shield-halved text-primary"></i>
                        Account Information
                    </h5>

                    <div class="account-info">

                        <div class="info-row">
                            <span>Account ID</span>
                            <strong id="accountId">—</strong>
                        </div>

                        <div class="info-row">
                            <span>Account Role</span>
                            <strong id="accountRole">—</strong>
                        </div>

                        <div class="info-row">
                            <span>Account Status</span>
                            <strong id="accountStatus" class="text-success">
                                Active
                            </strong>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>

</main>


<!-- BOOTSTRAP JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- PROFILE JS -->
<script src="js/profile.js"></script>

</body>
</html>
