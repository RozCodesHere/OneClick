<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reactivate Account — OneClick</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>

<body class="bg-light">

  <div class="container min-vh-100 d-flex justify-content-center align-items-center">
    <div class="card shadow-sm p-4" style="max-width: 450px; width: 100%;">

      <h3 class="text-center mb-2">Reactivate Account</h3>
      <p class="text-muted text-center">
        Verify your email to restore access to OneClick.
      </p>

      <div id="reactivateAlert" class="alert d-none"></div>

      <form id="reactivateRequestForm">
        <label class="form-label">Registered Email</label>
        <input
          type="email"
          id="reactivateEmail"
          class="form-control mb-3"
          placeholder="you@example.com"
          required
        >

        <button type="submit" class="btn btn-primary w-100">
          Send Verification Code
        </button>
      </form>

      <form id="reactivateVerifyForm" class="d-none mt-3">
        <label class="form-label">Verification Code</label>
        <input
          type="text"
          id="reactivateOTP"
          class="form-control mb-3"
          placeholder="Enter 6-digit OTP"
          maxlength="6"
          inputmode="numeric"
          required
        >

        <button type="submit" class="btn btn-success w-100">
          Verify & Reactivate
        </button>
      </form>

      <p class="text-center mt-3 mb-0">
        <a href="login.html">Back to Login</a>
      </p>

    </div>
  </div>
<script src="js/reactivate-account.js"></script>
</body>
</html>
