
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Jobs | OneClick Provider</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/provider-dashboard.css">
    <link rel="stylesheet" href="css/provider-todays-jobs.css">

   
</head>

<body>

<!-- ================= SIDEBAR ================= -->

<aside class="sidebar">

    <div class="sidebar-header">
        <a class="navbar-brand oc-brand" href="provider-dashboard.html">
    <img src="assests/images/logo.png"
         alt="OneClick"
         class="oneclick-logo">
</a>
    </div>

    <nav class="sidebar-nav">

        <a href="provider-dashboard.html" class="nav-link">
            <i class="fas fa-chart-line"></i>
            <span>Dashboard</span>
        </a>

        <a href="provider-job-requests.html" class="nav-link">
            <i class="fas fa-clipboard-list"></i>
            <span>Job Requests</span>
        </a>

        <a href="chat.html" class="nav-link">
            <i class="fas fa-comments"></i>
            <span>Messages</span>
        </a>

        <a href="provider-todays-jobs.html" class="nav-link active">
            <i class="fas fa-calendar-day"></i>
            <span>My Jobs</span>
        </a>

        <a href="provider-completed-jobs.html" class="nav-link">
            <i class="fas fa-check-circle"></i>
            <span>Completed Jobs</span>
        </a>

        <a href="review.html" class="nav-link">
            <i class="fas fa-star"></i>
            <span>Reviews</span>
        </a>

    </nav>

    <div class="sidebar-footer">

        <a href="#" id="logoutBtn" class="nav-link">
            <i class="fas fa-sign-out-alt"></i>
            <span>Logout</span>
        </a>

    </div>

</aside>


<!-- ================= MAIN ================= -->

<main class="main-content">

    <header class="topbar">

        <button
            id="sidebarToggle"
            class="btn btn-light d-md-none"
        >
            <i class="fas fa-bars"></i>
        </button>

        <div class="topbar-title">
            <h5>My Jobs</h5>
        </div>

        <div class="provider-top-info">
            <span id="providerName">Provider</span>
        </div>

    </header>


    <div class="page-content">

        <div class="page-header">

            <h2>My Jobs</h2>

            <p>
                View and manage all your accepted jobs in one place.
            </p>

            <div class="today-date">
                <i class="fas fa-calendar-day"></i>
                <span id="todayDate">Loading date...</span>
            </div>

        </div>


        <div class="schedule-card">

            <div
                id="todayScheduleTimeline"
            >

                <div class="text-center py-5">

                    <div
                        class="spinner-border"
                        role="status"
                    ></div>

                    <p class="mt-3">
                        Loading your jobs...
                    </p>

                </div>

            </div>

        </div>

    </div>

</main>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="js/provider-todays-jobs.js"></script>

</body>
</html>
