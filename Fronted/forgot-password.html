<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — OneClick</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="oc-auth-body">

    <div class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="card shadow p-4" style="max-width: 450px; width: 100%;">

            <h3 class="mb-2">Forgot Password?</h3>
            <p class="text-muted">Enter your registered email to request a password reset link.</p>

            <form id="forgotPasswordForm">
                <div class="mb-3">
                    <label for="resetEmail" class="form-label">Email address</label>
                    <input
                        type="email"
                        id="resetEmail"
                        class="form-control"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div id="forgotMessage" class="alert d-none" role="alert"></div>

                <button type="submit" class="btn btn-primary w-100">
                    Send Reset Link
                </button>
            </form>

            <a href="login.html" class="text-center mt-3">Back to Login</a>

        </div>
    </div>

    <script src="js/forgot-password.js"></script>
</body>
</html>
