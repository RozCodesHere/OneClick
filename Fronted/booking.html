<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Book Service | OneClick</title>


    <!-- Google Fonts -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- Custom CSS -->

    <link
        rel="stylesheet"
        href="css/booking.css"
    >

</head>


<body>


<!-- =====================================================
     NAVBAR
     ===================================================== -->

<nav class="navbar navbar-expand-lg oc-navbar">

    <div class="container">

        <a
            class="navbar-brand oc-brand"
            href="customer-dashboard.html"
        >

            <span class="brand-icon">
                <i class="fa-solid fa-bolt"></i>
            </span>

            <span>OneClick</span>

        </a>


        <div class="ms-auto">

            <a
                href="customer-dashboard.html"
                class="btn btn-outline-primary"
            >

                <i class="fa-solid fa-arrow-left"></i>

                Dashboard

            </a>

        </div>

    </div>

</nav>



<!-- =====================================================
     PAGE
     ===================================================== -->

<main class="booking-page">

    <div class="container">

        <div class="row justify-content-center">


            <!-- =================================================
                 BOOKING CARD
                 ================================================= -->

            <div class="col-xl-9 col-lg-10">

                <div class="booking-card">


                    <!-- HEADER -->

                    <div class="booking-header">

                        <div class="booking-icon">

                            <i class="fa-solid fa-calendar-check"></i>

                        </div>


                        <div>

                            <h1>
                                Book a Service
                            </h1>

                            <p>
                                Schedule your service with a trusted OneClick professional.
                            </p>

                        </div>

                    </div>



                    <!-- PROVIDER -->

                    <div class="provider-preview">

                        <img
                            src=""
                            alt="Provider"
                            id="providerImage"
                        >


                        <div>

                            <h4 id="providerName">
                                Loading provider...
                            </h4>


                            <p id="providerCategory">
                                Loading...
                            </p>


                            <span
                                class="provider-status"
                                id="providerStatus"
                            >

                                <i class="fa-solid fa-circle"></i>

                                Checking availability...

                            </span>

                        </div>

                    </div>



                    <!-- FORM -->

                    <form id="bookingForm">


                        <!-- SERVICE -->

                        <div class="form-section">

                            <h3>
                                <i class="fa-solid fa-screwdriver-wrench"></i>
                                Service Details
                            </h3>


                            <div class="mb-4">

                                <label
                                    for="service"
                                    class="form-label"
                                >
                                    Select Service
                                </label>


                                <select
                                    id="service"
                                    class="form-select"
                                    required
                                >

                                    <option value="">
                                        Loading services...
                                    </option>

                                </select>


                                <div
                                    class="form-text"
                                    id="serviceDescription"
                                >
                                    Select a service to see details.
                                </div>

                            </div>


                            <div
                                class="price-preview"
                                id="pricePreview"
                            >

                                <span>
                                    Estimated Price
                                </span>

                                <strong>
                                    Rs. 0.00
                                </strong>

                            </div>

                        </div>



                        <!-- DATE / TIME -->

                        <div class="form-section">

                            <h3>

                                <i class="fa-solid fa-calendar-days"></i>

                                Schedule

                            </h3>


                            <div class="row g-3">


                                <div class="col-md-6">

                                    <label
                                        for="bookingDate"
                                        class="form-label"
                                    >
                                        Service Date
                                    </label>


                                    <input
                                        type="date"
                                        id="bookingDate"
                                        class="form-control"
                                        required
                                    >

                                </div>



                                <div class="col-md-6">

                                    <label
                                        for="bookingTime"
                                        class="form-label"
                                    >
                                        Service Time
                                    </label>


                                    <input
                                        type="time"
                                        id="bookingTime"
                                        class="form-control"
                                        required
                                    >

                                </div>

                            </div>

                        </div>



                        <!-- ADDRESS -->

                        <div class="form-section">

                            <h3>

                                <i class="fa-solid fa-location-dot"></i>

                                Service Location

                            </h3>


                            <label
                                for="address"
                                class="form-label"
                            >
                                Address
                            </label>


                            <textarea
                                id="address"
                                class="form-control"
                                rows="3"
                                placeholder="Enter the address where the service is required..."
                                required
                            ></textarea>

                        </div>



                        <!-- NOTE -->

                        <div class="form-section">

                            <h3>

                                <i class="fa-regular fa-note-sticky"></i>

                                Additional Information

                            </h3>


                            <label
                                for="note"
                                class="form-label"
                            >
                                Note
                            </label>


                            <textarea
                                id="note"
                                class="form-control"
                                rows="4"
                                placeholder="Describe the problem or add any instructions for the provider..."
                            ></textarea>

                        </div>



                        <!-- ERROR -->

                        <div
                            class="booking-error"
                            id="bookingError"
                        ></div>



                        <!-- SUBMIT -->

                        <button
                            type="submit"
                            class="btn btn-book-submit"
                            id="submitBooking"
                        >

                            <i class="fa-solid fa-calendar-check"></i>

                            Confirm Booking

                        </button>


                    </form>

                </div>

            </div>

        </div>

    </div>

</main>



<!-- =====================================================
     JAVASCRIPT
     ===================================================== -->

<script src="js/booking.js"></script>

</body>

</html>
