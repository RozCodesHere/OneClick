
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email | OneClick</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f6fa;
            font-family: Arial, sans-serif;
        }

        .verify-card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .verify-icon {
            font-size: 45px;
            color: #2563eb;
        }

        .otp-input {
            letter-spacing: 10px;
            font-size: 24px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="verify-card text-center">

        <div class="verify-icon mb-3">
            <i class="bi bi-envelope-check"></i>
            ✉️
        </div>

        <h3 class="fw-bold">Verify Your Email</h3>

        <p class="text-muted">
            We sent a 6-digit verification code to your email address.
        </p>

        <form id="verifyEmailForm">

            <div class="mb-3 text-start">
                <label for="verifyEmail" class="form-label">
                    Email Address
                </label>

                <input
                    type="email"
                    id="verifyEmail"
                    class="form-control"
                    readonly
                    required
                >
            </div>

            <div class="mb-3 text-start">
                <label for="verificationCode" class="form-label">
                    Verification Code
                </label>

                <input
                    type="text"
                    id="verificationCode"
                    class="form-control otp-input"
                    placeholder="000000"
                    maxlength="6"
                    inputmode="numeric"
                    pattern="[0-9]{6}"
                    required
                >
            </div>

            <div id="verifyMessage" class="mb-3"></div>

            <button
                type="submit"
                id="verifyButton"
                class="btn btn-primary w-100 py-2"
            >
                Verify Email
            </button>

            <button
    type="button"
    id="resendCodeButton"
    class="btn btn-outline-primary w-100 mt-2"
>
    Resend Verification Code
</button>

        </form>

    </div>

    <script src="js/verify-email.js"></script>

</body>
</html>
