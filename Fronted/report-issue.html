<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report an Issue | OneClick</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="css/report-issue.css">
</head>

<body>

<!-- ================= NAVBAR ================= -->
<nav class="oc-navbar navbar navbar-expand-lg sticky-top">
    <div class="container">

        <a class="oc-brand navbar-brand" href="customer-dashboard.html">
            <i class="fa-solid fa-bolt"></i>
            <span>OneClick</span>
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#ocNav"
        >
            <i class="fa-solid fa-bars"></i>
        </button>

        <div class="collapse navbar-collapse" id="ocNav">

            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">

                <li class="nav-item">
                    <a class="nav-link" href="customer-dashboard.html">
                        Dashboard
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="booking.html">
                        Bookings
                    </a>
                </li>

               

                <li class="nav-item">
                    <a class="nav-link" href="notifications.html">
                        Notifications
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="customer-dashboard.html">
                        Profile
                    </a>
                </li>

                <li class="nav-item ms-lg-2">
                    <a
                        href="login.html"
                        id="logoutBtn"
                        class="btn oc-btn-logout"
                    >
                        <i class="fa-solid fa-right-from-bracket me-1"></i>
                        Logout
                    </a>
                </li>

            </ul>

        </div>
    </div>
</nav>


<!-- ================= MAIN ================= -->
<main class="report-page">

    <div class="container">

        <div class="report-wrapper">

            <!-- Header -->
            <div class="report-header text-center">

                <div class="report-icon">
                    <i class="fa-solid fa-flag"></i>
                </div>

                <h1>Report an Issue</h1>

                <p>
                    Tell us what went wrong and we'll help you resolve it.
                </p>

            </div>


            <!-- Report Card -->
            <div class="report-card">

                <form id="reportForm">

                    <!-- Issue Type -->
                    <div class="mb-4">

                        <label for="issueType" class="form-label">
                            Issue Type
                        </label>

                        <select
                            id="issueType"
                            class="form-select"
                            required
                        >
                            <option value="">Select an issue</option>
                            <option value="booking">
                                Booking Problem
                            </option>
                            <option value="payment">
                                Payment Problem
                            </option>
                            <option value="provider">
                                Provider Issue
                            </option>
                            <option value="service">
                                Service Quality
                            </option>
                            <option value="technical">
                                Technical Problem
                            </option>
                            <option value="other">
                                Other
                            </option>
                        </select>

                    </div>


                    <!-- Booking Reference -->
                    <div class="mb-4">

                        <label for="bookingReference" class="form-label">
                            Booking / Reference ID
                            <span class="optional">(Optional)</span>
                        </label>

                        <input
                            type="text"
                            id="bookingReference"
                            class="form-control"
                            placeholder="Example: BK-20841"
                            maxlength="50"
                        >

                    </div>


                    <!-- Description -->
                    <div class="mb-4">

                        <div class="d-flex justify-content-between align-items-center">

                            <label for="issueDescription" class="form-label mb-0">
                                Describe the Issue
                            </label>

                            <span id="characterCount">
                                0 / 500
                            </span>

                        </div>

                        <textarea
                            id="issueDescription"
                            class="form-control mt-2"
                            rows="6"
                            maxlength="500"
                            placeholder="Please explain what happened..."
                            required
                        ></textarea>

                    </div>


                    <!-- Message -->
                    <div id="reportMessage" class="report-message d-none"></div>


                    <!-- Submit -->
                    <button
                        type="submit"
                        id="submitReport"
                        class="btn btn-submit w-100"
                    >
                        <i class="fa-solid fa-paper-plane me-2"></i>
                        Submit Report
                    </button>

                </form>

            </div>


            <!-- Back -->
            <div class="text-center mt-4">

                <a href="chat.html" class="back-link">
                    <i class="fa-solid fa-arrow-left me-2"></i>
                    Back to Messages
                </a>

            </div>

        </div>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/report-issue.js"></script>

</body>
</html>
