<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/review.css">
</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg oc-navbar sticky-top">

    <div class="container">

        <a
            class="navbar-brand oc-brand"
            href="customer-dashboard.html"
        >
            <span class="brand-icon">
                <i class="fa-solid fa-bolt"></i>
            </span>

            <span>OneClick</span>
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navMenu"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">

            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="customer-dashboard.html"
                    >
                        <i class="fa-solid fa-gauge me-1"></i>
                        Dashboard
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="booking.html"
                    >
                        <i class="fa-solid fa-calendar-check me-1"></i>
                        Bookings
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="chat.html"
                    >
                        <i class="fa-solid fa-comment-dots me-1"></i>
                        Messages
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="notifications.html"
                    >
                        <i class="fa-solid fa-bell me-1"></i>
                        Notifications
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="customer-dashboard.html"
                    >
                        <i class="fa-solid fa-user me-1"></i>
                        Profile
                    </a>
                </li>

                <li class="nav-item ms-lg-2">
                    <a
                        class="nav-link btn-logout"
                        href="login.html"
                    >
                        <i class="fa-solid fa-right-from-bracket me-1"></i>
                        Logout
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- ================= PAGE ================= -->

<main class="review-page">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-xl-8 col-lg-9">

                <div class="review-card">

                    <!-- HEADER -->

                    <div class="review-header">

                        <div class="review-icon">
                            <i class="fa-solid fa-star"></i>
                        </div>

                        <div>

                            <h1>Leave a Review</h1>

                            <p>
                                Share your experience with the service provider.
                            </p>

                        </div>

                    </div>


                    <!-- PROVIDER -->

                    <div class="provider-preview">

                        <div class="provider-avatar">
                            <i class="fa-solid fa-user"></i>
                        </div>

                        <div>

                            <h4>Service Provider</h4>

                            <p>
                                Your recent OneClick service
                            </p>

                        </div>

                    </div>


                    <!-- REVIEW FORM -->

                    <form id="reviewForm">

                        <!-- RATING -->

                        <div class="form-section">

                            <label class="form-label">
                                How was your experience?
                            </label>

                            <div
                                class="star-rating"
                                id="starRating"
                                role="radiogroup"
                                aria-label="Rating"
                            >

                                <button
                                    type="button"
                                    class="star-btn"
                                    data-rating="1"
                                    aria-label="1 star"
                                >
                                    <i class="fa-solid fa-star"></i>
                                </button>

                                <button
                                    type="button"
                                    class="star-btn"
                                    data-rating="2"
                                    aria-label="2 stars"
                                >
                                    <i class="fa-solid fa-star"></i>
                                </button>

                                <button
                                    type="button"
                                    class="star-btn"
                                    data-rating="3"
                                    aria-label="3 stars"
                                >
                                    <i class="fa-solid fa-star"></i>
                                </button>

                                <button
                                    type="button"
                                    class="star-btn"
                                    data-rating="4"
                                    aria-label="4 stars"
                                >
                                    <i class="fa-solid fa-star"></i>
                                </button>

                                <button
                                    type="button"
                                    class="star-btn"
                                    data-rating="5"
                                    aria-label="5 stars"
                                >
                                    <i class="fa-solid fa-star"></i>
                                </button>

                            </div>

                            <div
                                id="ratingText"
                                class="rating-text"
                            >
                                Select a rating
                            </div>

                            <input
                                type="hidden"
                                id="rating"
                                value=""
                            >

                        </div>


                        <!-- REVIEW -->

                        <div class="form-section">

                            <label
                                for="reviewText"
                                class="form-label"
                            >
                                Your Review
                            </label>

                            <textarea
                                id="reviewText"
                                class="form-control"
                                rows="6"
                                maxlength="500"
                                placeholder="Tell us about your experience..."
                                required
                            ></textarea>

                            <div class="form-text">
                                <span id="characterCount">0</span>/500 characters
                            </div>

                        </div>


                        <!-- MESSAGE -->

                        <div
                            id="reviewMessage"
                            class="review-message"
                        ></div>


                        <!-- SUBMIT -->

                        <button
                            type="submit"
                            class="btn btn-review-submit"
                        >
                            <i class="fa-solid fa-paper-plane"></i>
                            Submit Review
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</main>


<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JS -->
<script src="js/review.js"></script>

</body>
</html>
