
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Services | OneClick Admin</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="css/admin-dashboard.css">

    <style>
        body {
            background: #f5f7fb;
        }

        .admin-services-page {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .service-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .service-card {
            background: #fff;
            border-radius: 14px;
            padding: 24px;
            border: 1px solid #e8edf3;
        }

        .service-icon {
            font-size: 25px;
            margin-bottom: 15px;
        }

        .service-category,
        .service-meta {
            margin-top: 10px;
            color: #6b7280;
            font-size: 14px;
        }

        .service-price {
            margin-top: 12px;
            font-weight: 700;
        }

        @media (max-width: 576px) {
            .admin-services-page {
                padding: 24px 14px;
            }
        }


.service-provider-list {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.service-provider-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px;
    background: #f7f9fc;
    border-radius: 10px;
    flex-wrap: wrap;
}

.service-provider-avatar {
    width: 42px;
    height: 42px;
    min-width: 42px;
    border-radius: 50%;
    background: #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-weight: 700;
}

.service-provider-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.service-provider-info {
    flex: 1;
    min-width: 100px;
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.service-provider-info strong {
    font-size: 14px;
}

.service-provider-info small {
    color: #64748b;
    font-size: 12px;
}

.service-provider-view {
    font-size: 12px;
    font-weight: 600;
    text-decoration: none;
    color: #2563eb;
}

.service-provider-view:hover {
    text-decoration: underline;
}

.service-no-providers {
    padding: 12px;
    color: #64748b;
    font-size: 13px;
    background: #f7f9fc;
    border-radius: 8px;
}

    </style>
</head>

<body>

    <main class="admin-services-page">

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">

            <div>
                <span class="section-eyebrow">ADMINISTRATION</span>

                <h1>Service Management</h1>

                <p>
                    View the services currently available on OneClick.
                </p>
            </div>

            <a href="admin-dashboard.html" class="btn btn-outline-secondary">
                <i class="fa-solid fa-arrow-left"></i>
                Back to Dashboard
            </a>

        </div>

        <div
            class="service-grid"
            id="serviceGrid"
        >
            <div class="empty-state">
                Loading services...
            </div>
        </div>

    </main>

    <script src="js/admin-services.js"></script>

</body>
</html>
